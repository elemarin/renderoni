<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderoni — High-Performance 3D Game Engine & Demos</title>
    <link rel="stylesheet" href="./src/demo/index.css" />
  </head>
  <body>
    <!-- 3D WebGL Canvas -->
    <canvas id="render-canvas" tabindex="0"></canvas>

    <!-- Top Navigation / Archetype Selector -->
    <nav class="top-nav">
      <div class="brand-badge">🍝 Renderoni</div>
      <button class="tab-btn active" data-mode="psx">🔦 Echoes of Blackwood (PSX 1st-Person)</button>
      <button class="tab-btn" data-mode="flight">✈️ Skyward Courier (Flight)</button>
      <button class="tab-btn" data-mode="voxel">🧱 Monolith: Voxel Ruins</button>
      <button class="tab-btn" data-mode="quickstart">🪙 Quickstart</button>
    </nav>

    <!-- Contextual Game HUD -->
    <div id="game-hud"></div>

    <!-- Retro Note Inspection Overlay (for PSX game) -->
    <div id="inspect-modal" class="inspect-modal" style="display: none;">
      <div class="inspect-card">
        <div class="inspect-header">
          <span class="inspect-title">📜 Investigation Clue</span>
          <button id="btn-close-inspect" class="btn-close">×</button>
        </div>
        <div id="inspect-body-text" class="inspect-text">...</div>
        <div class="inspect-hint">[Press E or Click to Dismiss]</div>
      </div>
    </div>

    <!-- Hover Interaction Crosshair Prompt -->
    <div id="interaction-prompt" class="interaction-prompt" style="display: none;">
      <span id="prompt-text"></span>
    </div>

    <div id="loop-overlay" class="loop-overlay" hidden>
      <div class="loop-card">
        <div id="loop-kicker" class="loop-kicker">Renderoni</div>
        <h1 id="loop-title" class="loop-title">Play</h1>
        <p id="loop-body" class="loop-body"></p>
        <button id="loop-action" class="loop-btn" type="button">Play</button>
      </div>
    </div>

    <!-- Live Agent Inspector HUD (Bottom Right) -->
    <div class="inspector-panel">
      <div class="inspector-header">
        <div class="title">
          <span>🤖</span> Agent Inspector
        </div>
        <div class="meta">
          <span id="inspector-tick" class="badge">Tick: 0</span>
          <span id="inspector-hash" class="badge">Hash: ...</span>
          <span id="inspector-bytes" class="badge success">0B / 500B</span>
          <button id="toggle-inspector" class="btn-icon" title="Toggle Inspector">▼</button>
        </div>
      </div>
      <div id="inspector-body">
        <div id="inspector-content" class="inspector-terminal"># Initializing Renderoni Engine...</div>
        <div class="quick-actions-row" id="quick-actions">
          <button class="chip-btn" data-action="quest.readJournal">📖 Read Journal</button>
          <button class="chip-btn" data-action="quest.pickupKey">🗝️ Pickup Key</button>
          <button class="chip-btn" data-action="quest.solveClock">🕰️ Solve Clock (11:45)</button>
          <button class="chip-btn" data-action="quest.pickupCrest">🛡️ Pickup Crest</button>
          <button class="chip-btn" data-action="quest.unlockGate">🚪 Escape Gate</button>
        </div>
        <div class="action-bar">
          <input id="action-input" type="text" placeholder="Dispatch action (e.g. hero.move or JSON)" />
          <button id="btn-dispatch-action">Act</button>
        </div>
      </div>
    </div>

    <!-- Entry Script -->
    <script type="module" src="./src/demo/main.ts"></script>
  </body>
</html>
